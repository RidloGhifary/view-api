<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Request Log - View API</title>
    <link rel="stylesheet" href="./style.css" />
    <style>
      #app.inspector-mode {
        grid-template-columns: 1fr;
        height: 100vh;
        overflow: hidden;
      }

      .inspector-layout {
        display: flex;
        height: 100vh;
        flex-direction: column;
        background: var(--bg);
      }

      .inspector-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 8px 20px;
        border-bottom: 1px solid var(--border);
        background: var(--sidebar);
        min-height: 56px;
      }

      .inspector-header .brand-lockup h1 {
        margin: 0;
        font-size: 1.1rem;
        color: var(--text-strong);
      }

      .header-actions {
        display: flex;
        align-items: center;
        gap: 12px;
      }

      .inspector-main {
        display: grid;
        grid-template-columns: 350px 1fr;
        flex: 1;
        overflow: hidden;
      }

      .request-list-pane {
        display: flex;
        flex-direction: column;
        border-right: 1px solid var(--border);
        background: var(--sidebar);
        overflow: hidden;
      }

      .list-controls {
        padding: 12px;
        border-bottom: 1px solid var(--border);
        display: flex;
        flex-direction: column;
        gap: 10px;
      }

      .search-container {
        position: relative;
      }

      .search-input {
        width: 100%;
        background: rgba(2, 6, 23, 0.4);
        border: 1px solid var(--border);
        border-radius: var(--radius-control);
        color: var(--text);
        padding: 8px 12px;
        font-size: 0.85rem;
      }

      .search-input:focus {
        border-color: var(--accent);
      }

      .list-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 8px 4px;
      }

      .list-header h2 {
        margin: 0;
        font-size: 0.85rem;
        color: var(--muted);
        text-transform: uppercase;
        letter-spacing: 0.05em;
      }

      .requests-scroll {
        flex: 1;
        overflow-y: auto;
      }

      .request-item {
        display: grid;
        grid-template-columns: 50px 1fr auto;
        align-items: center;
        gap: 10px;
        padding: 10px 12px;
        border-bottom: 1px solid var(--border-soft);
        cursor: pointer;
        transition: background 0.15s ease;
      }

      .request-item:hover {
        background: rgba(255, 255, 255, 0.03);
      }

      .request-item.active {
        background: rgba(6, 182, 212, 0.1);
        border-left: 3px solid var(--accent);
        padding-left: 9px;
      }

      .request-item .method {
        font-size: 0.7rem;
        font-weight: 800;
        text-align: center;
      }

      .request-item .path {
        font-family: var(--font-mono, monospace);
        font-size: 0.85rem;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        color: var(--text-strong);
      }

      .request-item .meta {
        display: flex;
        flex-direction: column;
        align-items: flex-end;
        gap: 2px;
      }

      .request-item .status {
        font-size: 0.8rem;
        font-weight: 700;
      }

      .request-item .duration {
        font-size: 0.7rem;
        color: var(--muted);
      }

      .detail-pane {
        display: flex;
        flex-direction: column;
        overflow: hidden;
        background: var(--bg);
      }

      .detail-header {
        padding: 20px;
        border-bottom: 1px solid var(--border);
      }

      .detail-meta {
        display: flex;
        gap: 15px;
        font-size: 0.75rem;
        color: var(--muted);
        margin-bottom: 10px;
      }

      .detail-title-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 20px;
      }

      .detail-title {
        display: flex;
        align-items: center;
        gap: 12px;
        font-size: 1.25rem;
        font-family: var(--font-mono, monospace);
        font-weight: 700;
        color: var(--text-strong);
      }

      .detail-scroll {
        flex: 1;
        overflow-y: auto;
        padding: 20px;
      }

      .section-tabs {
        display: flex;
        gap: 2px;
        margin-bottom: 15px;
        border-bottom: 1px solid var(--border);
      }

      .section-tab {
        padding: 8px 16px;
        font-size: 0.85rem;
        font-weight: 600;
        color: var(--muted);
        cursor: pointer;
        border-bottom: 2px solid transparent;
        margin-bottom: -1px;
      }

      .section-tab:hover {
        color: var(--text);
      }

      .section-tab.active {
        color: var(--accent);
        border-bottom-color: var(--accent);
      }

      .tab-content {
        display: none;
      }

      .tab-content.active {
        display: block;
      }

      .data-grid {
        display: grid;
        grid-template-columns: auto 1fr;
        gap: 10px 20px;
        margin-bottom: 20px;
      }

      .data-label {
        color: var(--muted);
        font-size: 0.8rem;
        font-weight: 600;
        white-space: nowrap;
      }

      .data-value {
        color: var(--text);
        font-size: 0.85rem;
        word-break: break-all;
      }

      .code-block {
        background: #0b1220;
        border: 1px solid var(--border);
        border-radius: var(--radius);
        padding: 15px;
        font-family: "JetBrains Mono", monospace;
        font-size: 0.8rem;
        line-height: 1.5;
        overflow-x: auto;
        white-space: pre-wrap;
        color: #dbeafe;
      }

      .response-section {
        margin-top: 30px;
        padding-top: 30px;
        border-top: 2px solid var(--border);
      }

      .response-header {
        display: flex;
        align-items: center;
        gap: 12px;
        margin-bottom: 20px;
      }

      .response-status {
        font-size: 1.1rem;
        font-weight: 700;
      }

      .empty-inspector {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        height: 100%;
        color: var(--muted);
        text-align: center;
        padding: 40px;
      }

      .empty-inspector h3 {
        color: var(--text);
        margin-bottom: 8px;
      }

      @media (max-width: 900px) {
        .inspector-header {
          flex-wrap: wrap;
          gap: 12px;
          padding: 12px 20px;
        }

        .inspector-main {
          grid-template-columns: 1fr;
        }

        .request-list-pane {
          height: 300px;
          border-right: none;
          border-bottom: 1px solid var(--border);
        }
      }
    </style>
  </head>
  <body>
    <div id="app" class="inspector-mode">
      <div class="inspector-layout">
        <header class="inspector-header">
          <div class="brand-lockup">
            <div class="brand-mark" aria-hidden="true">V</div>
            <h1>View API</h1>
          </div>
          <div class="header-actions">
            <div class="branch-badge">main</div>
            <a href="/" class="secondary-button">← Back to Editor</a>
          </div>
        </header>

        <main class="inspector-main">
          <aside class="request-list-pane">
            <div class="list-controls">
              <div class="search-container">
                <input
                  type="text"
                  id="filter-input"
                  class="search-input"
                  placeholder="Filter by method, path, status..."
                />
              </div>
              <div class="list-header">
                <h2>All Requests</h2>
                <button id="clear-requests" class="ghost-button" style="padding: 4px 8px; font-size: 0.75rem;">
                  Clear
                </button>
              </div>
            </div>
            <div id="requests-list" class="requests-scroll">
              <!-- Request items will be injected here -->
            </div>
          </aside>

          <section id="detail-pane" class="detail-pane">
            <div class="empty-inspector">
              <h3>Select a request to inspect</h3>
              <p>Every incoming mock API request will appear here.</p>
            </div>
          </section>
        </main>
      </div>
    </div>

    <div id="status" class="status-toast" role="status" aria-live="polite"></div>

    <script type="module" src="./requests.js"></script>
  </body>
</html>
